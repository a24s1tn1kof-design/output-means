<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вывод денег</title>
<style>
  :root{
    --bg:#eef4fa;
    --bg2:#dfeaf5;
    --card:#ffffff;
    --line:#c9dbea;
    --ink:#2c3e50;
    --muted:#7a93a8;
    --accent:#5b8fb9;
    --accent-d:#4a7ba3;
    --accent-l:#a9c9e2;
    --ok:#5a9e7c;
    --err:#b96a6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;color:var(--ink);
  }
  .app{
    width:100%;max-width:440px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 10px 30px rgba(91,143,185,.15);
    padding:28px 26px 26px;
  }
  .head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .head svg{flex:0 0 auto}
  h1{font-size:19px;font-weight:600;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}

  .step{display:none}
  .step.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{
    width:100%;padding:11px 13px;font-size:14px;
    border:1px solid var(--line);border-radius:10px;
    background:#f7fafd;color:var(--ink);outline:none;
    transition:border .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--accent-l);box-shadow:0 0 0 3px rgba(169,201,226,.35)}
  input::placeholder{color:#a8bccd}

  .btn{
    width:100%;margin-top:20px;padding:12px;
    border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),var(--accent-d));
    color:#fff;font-size:14px;font-weight:600;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .15s, transform .05s;
    box-shadow:0 3px 10px rgba(91,143,185,.3);
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:default;filter:none}

  .btn.ghost{
    background:#f2f7fb;color:var(--accent-d);
    border:1px solid var(--line);box-shadow:none;
  }
  .btn.ghost:hover{background:#e8f1f9}

  .msg{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.45;
    margin-top:16px;
  }
  .msg.ok{background:#eaf4ef;border:1px solid #c4e0d1;color:#3d6e55}
  .msg.err{background:#f9eeee;border:1px solid #e8cccc;color:#8a4b4b}
  .msg.info{background:#eef5fb;border:1px solid var(--line);color:#3f6480}
  .msg svg{flex:0 0 auto;margin-top:1px}

  .hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
  .divider{height:1px;background:var(--line);margin:20px 0}

  .summary{font-size:13px;color:var(--muted);line-height:1.7}
  .summary b{color:var(--ink);font-weight:600}

  .spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .center{text-align:center}
  .big-icon{display:flex;justify-content:center;margin-bottom:14px}
  .title{font-size:16px;font-weight:600;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <rect x="2" y="6" width="30" height="22" rx="4" stroke="#5b8fb9" stroke-width="2"/>
      <rect x="2" y="11" width="30" height="4" fill="#a9c9e2"/>
      <circle cx="25" cy="22" r="3" fill="#5b8fb9"/>
    </svg>
    <div>
      <h1>Вывод денег</h1>
      <div class="sub">Оформление заявки на вывод средств</div>
    </div>
  </div>

  <!-- ШАГ 1: ссылка -->
  <div class="step active" id="step1">
    <label>Ссылка на сайт</label>
    <input id="inSite" type="text" placeholder="https://example.com" autocomplete="off">
    <button class="btn" id="btnSite">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5" stroke="#fff" stroke-width="1.6"/>
        <path d="M11 11l3.5 3.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Проверить
    </button>
    <div id="msgSite"></div>
  </div>

  <!-- ШАГ 2: ник -->
  <div class="step" id="step2">
    <div class="msg ok" id="siteFound"></div>
    <label>Ник на сайте</label>
    <input id="inNick" type="text" placeholder="Ваш ник" autocomplete="off">
    <button class="btn" id="btnNick">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="5" r="3" stroke="#fff" stroke-width="1.6"/>
        <path d="M2.5 14c0-3 2.5-4.5 5.5-4.5s5.5 1.5 5.5 4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Продолжить
    </button>
    <div id="msgNick"></div>
  </div>

  <!-- ШАГ 3: сумма и карта -->
  <div class="step" id="step3">
    <label>Сумма вывода</label>
    <input id="inAmount" type="text" placeholder="0" inputmode="numeric" autocomplete="off">
    <label>Номер карты</label>
    <input id="inCard" type="text" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19" autocomplete="off">
    <button class="btn" id="btnWithdraw">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2v8M8 10l-3-3M8 10l3-3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 12v1.5h11V12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Вывести
    </button>
    <div id="msgWithdraw"></div>
  </div>

  <!-- ШАГ 4: заявка создана -->
  <div class="step" id="step4">
    <div class="center">
      <div class="big-icon">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
          <circle cx="26" cy="26" r="24" stroke="#a9c9e2" stroke-width="2"/>
          <path d="M16 27l7 7 13-14" stroke="#5a9e7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title">Заявка на вывод создана!</div>
      <div class="summary">Ожидайте обработки: 5–10 минут.</div>
    </div>
    <div class="divider"></div>
    <div class="summary" id="orderSummary"></div>
    <div class="msg info" id="statusMsg" style="display:none"></div>
    <div id="timerWrap" class="hint"></div>
    <button class="btn" id="btnNew" style="display:none">Новый вывод</button>
    <button class="btn ghost" id="btnStay" style="display:none">Остаться здесь</button>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const steps = {1:$('step1'),2:$('step2'),3:$('step3'),4:$('step4')};
  function show(n){
    Object.values(steps).forEach(s=>s.classList.remove('active'));
    steps[n].classList.add('active');
  }

  const ICON_OK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#5a9e7c" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#5a9e7c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_ERR = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#b96a6a" stroke-width="1.5"/><path d="M8 4.5v4.5M8 11.2v.3" stroke="#b96a6a" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const ICON_INFO = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#5b8fb9" stroke-width="1.5"/><path d="M8 7v4M8 4.8v.3" stroke="#5b8fb9" stroke-width="1.6" stroke-linecap="round"/></svg>';

  function setMsg(el, type, text){
    el.className = 'msg ' + type;
    el.innerHTML = (type==='ok'?ICON_OK:type==='err'?ICON_ERR:ICON_INFO) + '<span>'+text+'</span>';
    el.style.display = 'flex';
  }
  function clearMsg(el){ el.style.display='none'; el.innerHTML=''; }

  // ---------- проверка ссылки ----------
  // "Проверка" имитирует обращение к сайту: валидный URL + известные домены.
  // Известные домены можно расширить.
  const KNOWN = ['example.com','example.ru','test.com','site.ru','mail.ru','yandex.ru','google.com','vk.com'];

  function normalizeUrl(v){
    v = v.trim();
    if(!v) return null;
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try{
      const u = new URL(v);
      if(!u.hostname.includes('.')) return null;
      return u;
    }catch(e){ return null; }
  }

  let state = { site:'', nick:'', amount:'', card:'' };

  $('btnSite').addEventListener('click', () => {
    const box = $('msgSite');
    clearMsg(box);
    const u = normalizeUrl($('inSite').value);
    if(!u){
      setMsg(box,'err','Введите корректную ссылку на сайт.');
      return;
    }
    const btn = $('btnSite');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Проверка...';

    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = 'Проверить';
      const host = u.hostname.replace(/^www\./,'');
      const found = KNOWN.includes(host);
      if(found){
        state.site = host;
        setMsg($('siteFound'),'ok','Сайт найден: <b>'+host+'</b>');
        setTimeout(()=>{ show(2); $('inNick').focus(); }, 500);
      }else{
        setMsg(box,'err','Сайт не найден. Проверьте ссылку.');
      }
    }, 900);
  });

  $('inSite').addEventListener('keydown', e => { if(e.key==='Enter') $('btnSite').click(); });

  // ---------- ник ----------
  $('btnNick').addEventListener('click', () => {
    const box = $('msgNick');
    clearMsg(box);
    const nick = $('inNick').value.trim();
    if(nick.length < 2){
      setMsg(box,'err','Введите ник (минимум 2 символа).');
      return;
    }
    state.nick = nick;
    show(3);
    $('inAmount').focus();
  });
  $('inNick').addEventListener('keydown', e => { if(e.key==='Enter') $('btnNick').click(); });

  // ---------- сумма и карта ----------
  $('inAmount').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^\d]/g,'');
  });
  $('inCard').addEventListener('input', e => {
    let v = e.target.value.replace(/[^\d]/g,'').slice(0,16);
    e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
  });

  function luhn(num){
    let sum=0, alt=false;
    for(let i=num.length-1;i>=0;i--){
      let n = +num[i];
      if(alt){ n*=2; if(n>9) n-=9; }
      sum += n; alt = !alt;
    }
    return sum % 10 === 0;
  }

  let timers = [];
  function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }

  $('btnWithdraw').addEventListener('click', () => {
    const box = $('msgWithdraw');
    clearMsg(box);
    const amount = $('inAmount').value.trim();
    const card = $('inCard').value.replace(/\s/g,'');

    if(!amount || +amount <= 0){
      setMsg(box,'err','Введите сумму вывода.');
      return;
    }
    if(card.length !== 16 || !luhn(card)){
      setMsg(box,'err','Введите корректный номер карты (16 цифр).');
      return;
    }
    state.amount = amount;
    state.card = card;

    const btn = $('btnWithdraw');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Отправка...';

    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M8 10l-3-3M8 10l3-3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 12v1.5h11V12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg> Вывести';
      startOrder();
    }, 800);
  });

  function fmtCard(c){ return '**** **** **** ' + c.slice(-4); }

  // ---------- шаг 4: ожидание ----------
  function startOrder(){
    clearTimers();
    show(4);

    $('orderSummary').innerHTML =
      'Сайт: <b>'+state.site+'</b><br>' +
      'Ник: <b>'+state.nick+'</b><br>' +
      'Сумма: <b>'+Number(state.amount).toLocaleString('ru-RU')+' ₽</b><br>' +
      'Карта: <b>'+fmtCard(state.card)+'</b>';

    const status = $('statusMsg');
    setMsg(status,'info','Заявка на вывод создана! Ждите 5–10 минут.');

    $('btnNew').style.display = 'none';
    $('btnStay').style.display = 'none';
    $('timerWrap').textContent = '';

    // через 30 сек — "идёт вывод"
    timers.push(setTimeout(() => {
      setMsg(status,'info','Вывод обрабатывается. Пожалуйста, подождите.');
    }, 30000));

    // через 5 минут — завершено
    timers.push(setTimeout(() => {
      setMsg(status,'ok','Вывод завершён. Средства зачислены на карту.');
      $('btnNew').style.display = 'flex';
      $('btnStay').style.display = 'flex';
      $('timerWrap').textContent = '';
    }, 5*60*1000));

    // обратный отсчёт (5 минут)
    let left = 5*60;
    const tick = setInterval(() => {
      left--;
      if(left <= 0){ clearInterval(tick); return; }
      const m = String(Math.floor(left/60)).padStart(2,'0');
      const s = String(left%60).padStart(2,'0');
      $('timerWrap').textContent = 'Осталось: ' + m + ':' + s;
    }, 1000);
    timers.push(setTimeout(()=>clearInterval(tick), 5*60*1000+500));
  }

  $('btnNew').addEventListener('click', () => {
    clearTimers();
    state = { site:'', nick:'', amount:'', card:'' };
    $('inSite').value=''; $('inNick').value='';
    $('inAmount').value=''; $('inCard').value='';
    clearMsg($('msgSite')); clearMsg($('msgNick')); clearMsg($('msgWithdraw'));
    clearMsg($('siteFound')); clearMsg($('statusMsg'));
    show(1);
    $('inSite').focus();
  });

  $('btnStay').addEventListener('click', () => {
    $('btnStay').style.display = 'none';
    $('btnNew').style.display = 'none';
  });

})();
</script>
</body>
  </html>
